<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JiniWorks</title>
<style>
  :root { --bg:#EEF7FE; --card:#FFFFFF; --line:#BFDDF3; --ink:#1A5A8A; --ink-soft:#3F6A8C; --accent:#2A8BCB; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
    font-size:16px; line-height:1.75; word-break:keep-all; }
  main { max-width:640px; margin:0 auto; padding:40px 20px 56px; }
  h1 { font-size:26px; line-height:1.3; margin:0 0 6px; }
  .sub { color:var(--ink-soft); margin:0 0 24px; }
  h2 { font-size:18px; margin:28px 0 8px; }
  ul { padding-left:1.2em; margin:6px 0; }
  li { margin:4px 0; }
  a { color:var(--accent); overflow-wrap:anywhere; }
  a:focus-visible { outline:3px solid var(--accent); outline-offset:2px; border-radius:4px; }
  .card { background:var(--card); border:2px solid var(--line); border-radius:16px; padding:6px 22px 20px; margin-bottom:20px; }
  .jump { display:inline-block; margin:0 0 20px; font-size:15px; }
  .meta { color:var(--ink-soft); font-size:14px; margin-top:24px; }
  footer { color:var(--ink-soft); font-size:14px; text-align:center; margin-top:32px; }
</style>
</head>
<body>
<main>
  <h1>JiniWorks</h1>
  <p class="sub">인디 게임 개발 / Indie game developer</p>

  <div class="card">
    <h2>Grid64 : 블록 퍼즐 게임</h2>
    <p>8x8 보드를 채우는 블록 퍼즐. 클래식과 타임어택 모드.<br>A block puzzle on an 8x8 board, with Classic and Time Attack modes.</p>
    <ul>
      <li><a href="https://play.google.com/store/apps/details?id=com.jiniworks.grid64">Google Play</a></li>
      <li><a href="https://jininh.github.io/jiniworks-privacy/grid64.html">개인정보처리방침 / Privacy Policy</a></li>
      <li><a href="https://jininh.github.io/jiniworks-privacy/grid64-licenses.html">오픈소스 라이선스 / Licenses</a></li>
    </ul>
  </div>

  <p>문의 / Contact: jiniworks.dev@gmail.com</p>

  <footer>© JiniWorks</footer>
</main>
</body>
</html>
